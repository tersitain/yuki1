<style>
:root{--bg:#fff6e6;--card:#fff;--ink:#3b2f28;--sub:#85766a;--line:#eedfc8;--acc:#ef6f2e;--acc2:#ffe9d9;--kk:#1f9a8c;--kk2:#dcf3ef;--ok:#23944f;--okbg:#e2f6e8;--ng:#d94a36;--ngbg:#fde8e3;--gold:#f0ac1c;--hole:#fff1b8}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Noto Sans CJK JP","Noto Sans JP",Meiryo,sans-serif;line-height:1.6;-webkit-text-size-adjust:100%;touch-action:manipulation}
.kj{font-family:"YuKyokasho Yoko","YuKyokasho","UD デジタル 教科書体 NK-R","UD Digi Kyokasho NK-R","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans CJK JP",sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(56px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
button{font:inherit;color:inherit;cursor:pointer}
h1{font-size:1.5rem;margin:0}
h2{font-size:1.2rem;margin:26px 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h2 small{font-size:.85rem;color:var(--sub);font-weight:600}
h2.sh{cursor:pointer;-webkit-user-select:none;user-select:none;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 14px;margin:14px 0 10px;min-height:52px}
.chev{color:var(--sub);font-size:.8rem;width:1.1em;flex:none}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px 10px;flex-wrap:wrap}
.head h1{white-space:nowrap}
.hb{display:flex;gap:8px;flex:none;margin-left:auto}
.link{white-space:nowrap;flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:.85rem;font-weight:700;color:var(--sub)}
.stampbox{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 16px;margin:14px 0;display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap}
.cur{display:flex;align-items:center;gap:10px}
.cur b{display:block;font-size:1.02rem}
.cur small{display:block;color:var(--sub);font-weight:600;font-size:.82rem}
.cur em{font-style:normal;font-size:1.25rem}
.got{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.got b{margin-left:6px;font-size:.95rem;color:var(--sub)}
svg.px{display:block}
.tile{display:inline-grid;place-items:center;background:#eef6dc;border:2.5px solid #cfdcae;border-radius:24%;box-shadow:inset 0 0 0 3px #f8fceb}
.res .tile{border-width:4px;box-shadow:inset 0 0 0 6px #f8fceb}
.res .tile svg{animation:hop 1.1s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(3%)}50%{transform:translateY(-5%)}}
.cnt{margin-left:auto;display:flex;gap:14px;font-weight:700;font-size:.95rem;color:var(--sub)}
.cnt i{font-style:normal;color:var(--ink);font-size:1.15rem}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.bar.ctr{justify-content:center}
.btn{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:12px 18px;font-weight:700;font-size:1.05rem;min-height:52px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.kk{background:var(--kk);border-color:var(--kk);color:#fff}
.btn.rev{border-color:var(--ng);color:var(--ng)}
@media(prefers-color-scheme:dark){.btn.pri,.btn.kk{color:#1b1a18}}
.btn.big{font-size:1.3rem;padding:14px 34px;min-height:62px;border-radius:20px}
.btn:disabled{opacity:.4;cursor:default}
.btn:active:not(:disabled),.opt:active:not(:disabled),.unit:active,.bz:active{transform:scale(.97)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.unit{text-align:left;border:2px solid var(--line);background:var(--card);border-radius:18px;padding:12px 14px;display:block;width:100%;position:relative}
.unit .em{font-size:1.9rem;line-height:1.2;display:block}
.unit .num{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--kk2);color:var(--kk);font-size:1.5rem;font-weight:800}
.unit .num.w{font-size:1.2rem}
.unit b{display:block;font-size:1.02rem;margin-top:2px}
.unit small{color:var(--sub);display:block;font-size:.82rem;font-weight:600}
.unit .done{position:absolute;top:8px;right:10px;font-size:1.3rem}
.unit .badge{position:absolute;top:10px;right:10px;background:var(--ngbg);color:var(--ng);border-radius:999px;padding:0 9px;font-size:.75rem;font-weight:700}
.meter{height:8px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--acc);border-radius:4px}
.unit.m .meter i{background:var(--kk)}
.bosses{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.bz{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:6px 2px 6px;text-align:center}
.bz span{display:block;font-size:2rem;line-height:1.3}
.bz small{display:block;font-size:.7rem;color:var(--sub);font-weight:600;line-height:1.35}
.bz.off span{filter:grayscale(1);opacity:.3}
.bz.lock{border-style:dashed}
.bz.ready{border-color:var(--ng);animation:pulse 1.6s infinite}
.bz.won{border-color:var(--gold)}
@keyframes pulse{50%{box-shadow:0 0 0 5px var(--ngbg)}}
.alert{background:var(--ngbg);color:var(--ng);border-radius:12px;padding:10px 14px;font-size:.95rem;font-weight:700;margin:8px 0}
.okline{color:var(--ok);font-size:.82rem;font-weight:600;margin:6px 0}
.note{color:var(--sub);font-size:.8rem;margin-top:26px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.back{color:var(--sub);background:none;border:0;padding:8px 4px;font-weight:700;font-size:1rem}
.dots{display:flex;gap:7px;align-items:center}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--line);display:block}
.dots i.ok{background:var(--ok)}.dots i.ng{background:var(--ng)}.dots i.now{background:var(--card);border:3px solid var(--acc)}
.ttl{color:var(--sub);font-size:.9rem;font-weight:700}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:22px 20px}
.ask{font-size:1.05rem;font-weight:700;color:var(--sub);margin:0 0 6px;text-align:center}
.tag{display:inline-block;background:var(--ngbg);color:var(--ng);border-radius:999px;padding:1px 12px;font-size:.85rem;font-weight:700}
.sent{font-size:2rem;font-weight:700;text-align:center;margin:18px 0 8px;line-height:2.3;word-break:keep-all;overflow-wrap:anywhere}
.sent mark{background:var(--hole);color:inherit;border-radius:10px;padding:2px 8px;margin:0 3px;border-bottom:4px solid var(--acc)}
.sent mark.kj{font-size:2.5rem}
.sent mark.done{background:var(--okbg);border-color:var(--ok)}
.sent ruby{font-size:2.5rem}
.sent rt{font-size:1.05rem;font-weight:700;color:var(--ok);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif}
.sent.num{font-size:3.2rem;line-height:1.6;letter-spacing:.04em}
.sent.num mark{min-width:1.6em;display:inline-block}
.yomi{text-align:center;font-size:1.2rem;font-weight:700;color:var(--kk);min-height:1.9em;margin:0}
.how{background:var(--kk2);border-radius:16px;padding:10px 16px;margin:8px auto 4px;max-width:560px;text-align:left;font-size:1.05rem;font-weight:700;line-height:1.75}
.how p{margin:2px 0}
.how .fast{border-top:2px dashed var(--kk);margin-top:8px;padding-top:6px;color:var(--kk)}
.how svg{display:block;margin:2px auto 6px;max-width:100%;height:auto}
.how.hint{background:var(--hole)}
.hbtn{border:2px solid var(--gold);background:var(--card);border-radius:999px;padding:6px 18px;font-weight:700;font-size:.95rem;min-height:44px;margin-top:4px}
#hn{text-align:center}
.sent.eq{font-size:2.7rem;letter-spacing:0}
.gd h1{text-align:center;margin-bottom:8px}.gd>p{font-size:1.08rem;font-weight:600}
.gd .sent{margin:22px 0 0}
h2 .link{margin-left:auto}
@media(max-width:520px){.sent.eq{font-size:1.9rem}}
.spk{text-align:center;min-height:50px}
.spk button{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 18px;font-weight:700;font-size:.95rem;color:var(--sub);min-height:44px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.opt{border:3px solid var(--line);background:var(--card);border-radius:20px;padding:14px 6px;font-size:1.6rem;font-weight:700;min-height:88px;line-height:1.3;overflow-wrap:anywhere}
.opt.kj{font-size:2.6rem}
.opt.n{font-size:2.4rem}
.opt.long{font-size:1.25rem}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ng{border-color:var(--ng);background:var(--ngbg)}
.opt:disabled{cursor:default;color:inherit}
.opt:disabled:not(.ok):not(.ng){opacity:.5}
@media(max-width:520px){h1{font-size:1.2rem}.opts{grid-template-columns:1fr}.opt{min-height:64px}.sent{font-size:1.6rem}.sent.num{font-size:2.6rem}}
.opts.four{grid-template-columns:repeat(4,1fr)}

.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:400px;margin:10px auto 0}
.key{border:3px solid var(--line);background:var(--card);border-radius:18px;font-size:1.9rem;font-weight:700;min-height:66px}
.key.sub{font-size:1.05rem;color:var(--sub)}
.key.go{font-size:1.1rem;background:var(--kk);border-color:var(--kk);color:#fff}
@media(prefers-color-scheme:dark){.key.go{color:#1b1a18}}
.key:disabled{opacity:.45;cursor:default}
.key:active:not(:disabled){transform:scale(.96)}
.tm{height:10px;background:var(--line);border-radius:5px;overflow:hidden;max-width:420px;margin:8px auto 0}
.tm i{display:block;height:100%;width:100%;background:var(--kk)}.tm i.red{background:var(--ng)}
.combo{color:var(--gold);font-weight:800;min-height:1.7em;font-size:1.05rem}
.msg{font-weight:800;font-size:1.35rem;margin:14px 0 0;min-height:1.7em;text-align:center}
.msg.ok{color:var(--ok)}.msg.ng{color:var(--ng)}
.res{text-align:center}
.res .stamp{font-size:5.5rem;line-height:1.2;display:inline-block;animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
.res .stamp.still{animation:none}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}100%{transform:none}}
.res h1{font-size:1.7rem;margin:4px 0}
.res .sc{font-size:1.25rem;font-weight:700;margin:6px 0}
.star{color:var(--gold);font-size:2.2rem;letter-spacing:6px}
.star i{font-style:normal;color:var(--line)}
.arena{text-align:center;margin:0 0 12px}
.face{font-size:5rem;line-height:1.2;display:inline-block}
.face.hit{animation:hit .45s}
.face.down{filter:grayscale(1);transform:rotate(90deg);opacity:.6;transition:.5s}

.bname{font-weight:800;font-size:1.1rem}
.hp{height:16px;background:var(--line);border-radius:8px;overflow:hidden;max-width:420px;margin:6px auto 0}
.hp i{display:block;height:100%;background:var(--ng);transition:width .4s}
.hearts{font-size:1.5rem;letter-spacing:4px;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:left;font-size:.8rem;color:var(--sub);font-weight:600;padding:4px 6px;border-bottom:1.5px solid var(--line)}
td{border-bottom:1px solid var(--line);padding:7px 6px;vertical-align:top}
td.r,th.r{text-align:right;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stats div{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.stats b{display:block;font-size:1.35rem;line-height:1.3}
.stats small{color:var(--sub);font-size:.75rem}

.pa h2{font-size:1.05rem}
.pa p{font-size:.92rem}
textarea{width:100%;height:120px;margin-top:8px;font:inherit;font-size:.8rem;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:8px}
.sm{font-size:.9rem;padding:8px 14px;min-height:44px;border-radius:12px}
.ngc{color:var(--ng);font-weight:700}
</style>
</head>

function one(P,op,Q,c){
  if(op==='＋'){const o=P==null?Q:P,x=c-o;return [x,`${P==null?'□に '+o:o+'に □'}を たすと ${c}。ぎゃくに ${c}から ${o}を ひく：${c} − ${o} ＝ ${x}`,`たして ${c}に なった。ぎゃくに、${c}から ${o}を ひいて みよう`]}
  if(op==='−'){if(P==null){const x=c+Q;return [x,`□から ${Q}を ひくと ${c}。ぎゃくに ${c}に ${Q}を たす：${c} ＋ ${Q} ＝ ${x}`,`ひいて ${c}に なった。ぎゃくに、${c}に ${Q}を たして みよう`]}
    const x=P-c;return [x,`${P}から □を ひくと ${c}。ひいた かずは ${P} − ${c} ＝ ${x}`,`${P}から いくつ ひくと ${c}に なるかな？ ${P} − ${c} を けいさんして みよう`]}
  const o=P==null?Q:P,x=c/o;return [x,`${P==null?'□に '+o:o+'に □'}を かけると ${c}。${o}のだんで ${c}に なるのは ${o}×${x}＝${c}。だから ${x}`,`${o}のだんの 九九で、こたえが ${c}に なるのを さがそう`]}
function solve(q){const t=q.t,c=q.c;
  if(t.length===3){const r=one(t[0],t[1],t[2],c);return {lines:[r[1]],hint:r[2]}}
  if(t[4]==null){const m=OPS[t[1]](t[0],t[2]),r=one(m,t[3],null,c);
    return {lines:[`① さきに ${t[0]} ${t[1]} ${t[2]} を けいさんする：${m}`,`② しきは「${m} ${t[3]} □ ＝ ${c}」に なる`,'③ '+r[1]],hint:`さきに ${t[0]} ${t[1]} ${t[2]} を けいさんしよう。しきが みじかく なるよ`}}
  const inv=t[3]==='＋'?'−':'＋',m=t[3]==='＋'?c-t[4]:c+t[4],r=one(t[0],t[1],t[2],m),sub=`${B(t[0])} ${t[1]} ${B(t[2])}`;
  return {lines:[`① さいごの「${t[3]} ${t[4]}」を もとに もどす：${c} ${inv} ${t[4]} ＝ ${m}`,`② しきは「${sub} ＝ ${m}」に なる`,'③ '+r[1]],hint:`さいごの「${t[3]} ${t[4]}」を もとに もどそう。${c} ${inv} ${t[4]} は いくつ？ それが「${sub}」の こたえだよ`}}
const howS=q=>`<div class="how">${solve(q).lines.map(l=>`<p>${esc(l)}</p>`).join('')}<p class="fast">たしかめ：${esc(expr(q.t,q.c,q.x))} ⭕</p></div>`;

function area(a,b,vals){const p=a-10,two=b>10,cols=two?[10,b-10]:[10,p],rows=two?[10,p]:[b],W=[150,116],H=two?[58,46]:[58],x0=40,y0=26;
  const F=['rgba(239,111,46,.2)','rgba(31,154,140,.2)','rgba(240,172,28,.25)','rgba(138,99,230,.2)'];let h='',y=y0;
  rows.forEach((rv,i)=>{let x=x0;h+=`<text x="${x0-10}" y="${y+H[i]/2+5}" text-anchor="end" class="lb">${rv}</text>`;
    cols.forEach((cv,j)=>{if(!i)h+=`<text x="${x+W[j]/2}" y="${y0-8}" text-anchor="middle" class="lb">${cv}</text>`;
      h+=`<rect x="${x}" y="${y}" width="${W[j]}" height="${H[i]}" fill="${F[i*2+j]}" stroke="var(--sub)" stroke-width="1.5"/><text x="${x+W[j]/2}" y="${y+H[i]/2+5}" text-anchor="middle" class="cv">${two?rv+'×'+cv:cv+'×'+rv}${vals?'＝'+rv*cv:''}</text>`;x+=W[j]});y+=H[i]});
  return `<svg viewBox="0 0 ${x0+W[0]+W[1]+6} ${y+6}" width="${x0+W[0]+W[1]+6}" height="${y+6}" aria-hidden="true"><style>.lb{font-size:15px;font-weight:700;fill:var(--sub)}.cv{font-size:15px;font-weight:700;fill:var(--ink)}</style>${h}</svg>`}
function howM(q,hint){const a=q.a,b=q.b,p=a-10,r=b-10,P=l=>`<p>${l}</p>`;
  if(b===10)return P(hint?'💡 10ばいは、かずの うしろに 0を 1つ つけるよ':`10ばいは、うしろに 0を つける：${a} → ${a*b}`);
  if(b<10)return area(a,b,!hint)+P(`${hint?'💡 ':''}① ${a} を 10 と ${p} に わける`)+(hint?P(`② それぞれに ${b}を かけて、2つを たそう`):P(`② 10×${b}＝${10*b}、${p}×${b}＝${p*b}`)+P(`③ たすと ${10*b} ＋ ${p*b} ＝ ${a*b}`));
  return area(a,b,!hint)+P(`${hint?'💡 ':''}① ${a} を 10 と ${p}、${b} を 10 と ${r} に わける`)+(hint?P('② 4つの へやを それぞれ けいさんして、ぜんぶ たそう'):P(`② 10×10＝100　10×${r}＝${10*r}　${p}×10＝${p*10}　${p}×${r}＝${p*r}`)+P(`③ ぜんぶ たすと 100 ＋ ${10*r} ＋ ${p*10} ＋ ${p*r} ＝ ${a*b}`)
    +`<p class="fast">はやわざ：${a} ＋ ${r} ＝ ${a+r} を 10ばいして ${(a+r)*10}。そこに ${p}×${r}＝${p*r} を たして ${a*b}</p>`)}
function looks(k){const s=new Set();LOOK.forEach(g=>{if(g.includes(k))[...g].forEach(c=>{if(c!==k)s.add(c)})});return [...s]}
const every=g=>UNITS.reduce((a,u)=>(!g||u.g===g)?a.concat(u.qs):a,[]);

const kind=o=>/い$/.test(o)?'a':/[うくすつぬむるぐぶ]$/.test(o)?'v':'n';
function opts(q){
  const n=lv()===2?4:3;
  if(q.type==='s'){const c=q.x,s=new Set();shuf([c-1,c+1,c-2,c+2,c+10,c-10,c+5]).forEach(v=>{if(s.size<n-1&&v>=0&&v!==c)s.add(v)});
    return [c].concat([...s]).sort((x,y)=>x-y).map(String)}
  if(q.type==='m'){const c=q.a*q.b,s=new Set(),a=q.a,b=q.b;
    (a>9?[c-10,c+10,c-a,c+a,c-b,c+b]:[a*(b-1),a*(b+1),(a-1)*b,(a+1)*b]).forEach(v=>{if(v>0&&v!==c)s.add(v)});
    [c+1,c-1,c+2,c+10].forEach(v=>{if(s.size<n-1&&v>0&&v!==c)s.add(v)});
    return [c].concat(shuf([...s]).slice(0,n-1)).sort((x,y)=>x-y).map(String)}
  const e=q.e,r=q.type==='r',full=o=>o.sr+o.oku,out=[ans(q)];
  // むずかしい：形のにた字を2つまでまぜる（同じよみになる字はのぞく）
  if(!r&&lv()===2&&e.g==='k'&&e.stem.length===1)shuf(looks(e.k)).filter(c=>!ENT.some(o=>o.stem===c&&o.sr===e.sr)).slice(0,2).forEach(c=>out.push(c));
  const cand=ENT.filter(o=>o!==e&&o.g===e.g&&(r?full(o)!==full(e):(o.sr!==e.sr&&o.stem!==e.stem)));

  cand.map(o=>[score(o),o]).sort((x,y)=>y[0]-x[0]).some(([,o])=>{const v=r?full(o):o.stem;if(!out.includes(v))out.push(v);return out.length>=n});
  return shuf(out)}
function label(q){return q.type==='r'?'いろの ついた かんじは、なんと よむかな？':q.type==='w'?'いろの ついた ところを、かんじで かくと どれかな？':q.type==='s'?(lv()===2?'□に はいる かずを いれよう':'□に はいる かずは どれかな？'):lv()===2?'こたえを すうじで いれよう':'こたえは どれかな？'}
function body(q,done){
  if(q.type==='m')return `<p class="sent num">${q.a} × ${q.b} ＝ <mark class="${done?'done':''}">${done?q.a*q.b:'？'}</mark></p>`+(done&&q.a>10?`<div class="how">${howM(q)}</div>`:`<p class="yomi">${done?esc(YOMI[q.a-1][q.b-1]):''}</p>`);
  if(q.type==='s')return `<p class="sent num eq">${q.t.map(v=>v==null?`<mark class="${done?'done':''}">${done?q.x:'□'}</mark>`:v).join(' ')} ＝ ${q.c}</p>`+(done?howS(q):'<p class="yomi"></p>');
  const e=q.e;let mid;
  if(done)mid=`<mark class="done"><ruby class="kj">${esc(e.stem)}<rt>${esc(e.sr)}</rt></ruby></mark>${esc(e.oku)}`;
  else if(q.type==='r')mid=`<mark class="kj">${esc(e.stem+e.oku)}</mark>`;
  else mid=`<mark>${esc(e.sr)}</mark>${esc(e.oku)}`;
  return `<p class="sent">${esc(e.pre)}${mid}${esc(e.post)}</p>`}
const SAY={'＋':'たす','−':'ひく','×':'かける'};
function voice(q,done){if(q.type==='s')return q.t.map(v=>v==null?(done?q.x:'しかく'):SAY[v]||v).join(' ')+' は '+q.c;

  if(q.type==='r'&&!done)return '';const e=q.e;return e.pre+e.sr+e.oku+e.post}
function plain(q){if(q.type==='s')return expr(q.t,q.c)+'　□＝'+q.x;if(q.type==='m')return q.a+' × '+q.b+' ＝ '+q.a*q.b;const e=q.e;

const ttsOn=()=>canSpeak&&st.set.tts!==false;
function speak(t){if(!t||!ttsOn())return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function hush(){try{if(canSpeak)speechSynthesis.cancel()}catch(e){}}

/* ---- こうかおん：ファイルを使わず、その場で音を合成する ---- */
let actx=null;
const sndOn=()=>st.set.snd!==false;
function ac(){if(!sndOn())return null;try{if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;actx=new C()}
  if(actx.state==='suspended')actx.resume();return actx}catch(e){return null}}
// [高さHz, 開始秒, 長さ秒, 波形, 音量]
const SND={
 start:[[523,0,.07],[784,.07,.11]],
 tap:[[700,0,.035,'square',.04]],
 ok:[[988,0,.08],[1319,.08,.18]],
 ng:[[185,0,.13,'sawtooth',.09],[139,.12,.24,'sawtooth',.09]],
 out:[[330,0,.1,'sawtooth',.09],[220,.1,.1,'sawtooth',.09],[147,.2,.28,'sawtooth',.09]],
 time:[[1175,0,.05,'square',.05]],
 hit:[[247,0,.05,'sawtooth',.1],[988,.04,.07],[1319,.1,.14]],
 combo:[[784,0,.06],[988,.06,.06],[1175,.12,.06],[1568,.18,.2]],
 grow:[[659,0,.09],[784,.09,.09],[988,.18,.09],[1319,.27,.26]],
 adult:[[523,0,.11],[523,.13,.05],[523,.19,.05],[659,.25,.11],[784,.37,.11],[1047,.49,.13],[784,.63,.08],[1047,.72,.14],[1319,.87,.45]],
 win:[[523,0,.09],[659,.09,.09],[784,.18,.09],[1047,.27,.09],[1319,.36,.09],[1568,.45,.4]],
 lose:[[392,0,.2,'triangle',.2],[330,.2,.2,'triangle',.2],[262,.4,.45,'triangle',.2]]};
function sfx(n){const a=ac();if(!a)return;try{const t=a.currentTime+.01;SND[n].forEach(([f,t0,d,type,vol])=>{const o=a.createOscillator(),g=a.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t+t0);g.gain.setValueAtTime(.0001,t+t0);g.gain.linearRampToValueAtTime(vol||.07,t+t0+.012);g.gain.exponentialRampToValueAtTime(.0001,t+t0+d);
  o.connect(g);g.connect(a.destination);o.start(t+t0);o.stop(t+t0+d+.03)})}catch(e){}}

/* ---- きろく ---- */
function mark(q,ok){const k=q.key,r=Object.assign({},rec0(k));
  if(ok){r.r++;r.s++;if(r.s>=2)r.m=0}else{r.w++;r.s=0;r.m=1}
  r.t=Date.now();st.q[k]=r;const d=today(),g=st.days[d]||[0,0,0];g[0]++;if(ok)g[1]++;st.days[d]=g;save()}
function stamp(){const d=today(),g=st.days[d]||[0,0,0];g[2]=(g[2]||0)+1;st.days[d]=g;save()}
function unitStat(u){let c=0,m=0,a=0,ok=0,ev=0;const qs=UNITS[u].qs,n=qs.length;
  qs.forEach(q=>{const x=rec0(q.key);if(x.r)c++;if(x.m)m++;if(x.r+x.w){a++;if(x.s>0)ok++}if(x.w)ev++});
  return {n,c,m,a,ok,ev,rate:a?Math.round(ok/a*100):null}}
function totals(g){const t={n:0,c:0,m:0,a:0,ok:0,ev:0};UNITS.forEach((u,i)=>{if(g&&u.g!==g)return;const s=unitStat(i);for(const k in t)t[k]+=s[k]});
  t.rate=t.a?Math.round(t.ok/t.a*100):null;return t}
const pending=()=>every().filter(q=>rec0(q.key).m);
const rounds=d=>(st.days[d]||[])[2]||0;
function allStamps(){return Object.keys(st.days).reduce((a,d)=>a+rounds(d),0)}
function streak(){let n=0;const d=new Date();if(!rounds(today(d)))d.setDate(d.getDate()-1);
  while(rounds(today(d))){n++;d.setDate(d.getDate()-1)}return n}
const beaten=u=>st.boss[UNITS[u].id]||0;
const lockLeft=u=>{const s=unitStat(u);return s.n-s.c};

const petOf=ci=>PETS[ci%PETS.length];
// 0 たまご → 1・2 ひび → 3 かお → 4 あかちゃん → 5 こども → 6 かげ（おとなの形だけ） → 7 おとな
function grid(stage,ci){
  if(stage>=PET)return petOf(ci).d;
  if(stage===6)return petOf(ci).d.map(r=>r.replace(/[^.k]/g,'g'));
  if(stage===5)return KID;if(stage===4)return BABY;
  if(stage===3){const g=BABY.slice(3).concat(['................','................','................']);return g.map((r,y)=>SHELL[y]?[...SHELL[y]].map((c,x)=>c==='.'?r[x]:c).join(''):r)}
  const g=EGG.map(r=>[...r]);if(stage>=1)CRACK.forEach(([y,x])=>g[y][x]='k');if(stage===2)CRACK2.forEach(([y,x])=>g[y][x]='k');return g.map(r=>r.join(''))}
function pet(stage,size,ci){const P=petOf(ci),col=Math.floor(ci/PETS.length)%2?P.v:P.c;let h='';
  grid(stage,ci).forEach((r,y)=>{for(let x=0;x<16;){const c=r[x];let n=1;while(x+n<16&&r[x+n]===c)n++;
    if(c!=='.')h+=`<rect x="${x}" y="${y}" width="${n}" height="1" fill="${c==='c'?col[0]:c==='b'?col[1]:PX[c]}"/>`;x+=n}});
  return `<svg class="px" viewBox="0 0 16 16" width="${size}" height="${size}" shape-rendering="crispEdges" aria-hidden="true">${h}</svg>`}
const tile=(stage,size,ci)=>`<span class="tile" style="width:${size}px;height:${size}px">${pet(stage,Math.round(size*.8),ci)}</span>`;

/* ---- 出題のえらび方 ---- */
function uniq(order,n){const out=[],used=new Set();
  for(const q of order){if(used.has(same(q)))continue;used.add(same(q));out.push(q);if(out.length===n)return out}
  for(const q of order){if(out.length>=n)break;if(!out.includes(q))out.push(q)}return out}
function pick(u){const a=UNITS[u].qs,R=q=>rec0(q.key);
  const pe=shuf(a.filter(q=>R(q).m)),fresh=a.filter(q=>!R(q).m&&!R(q).r);
  const rest=a.filter(q=>!R(q).m&&R(q).r).sort((x,y)=>(R(x).t||0)-(R(y).t||0));
  // 復習まちを最大2問まぜ、のこりは「よみ → かき」の順にまだの問題から
  return shuf(uniq(pe.slice(0,2).concat(fresh.filter(q=>q.type!=='w'),fresh.filter(q=>q.type==='w'),pe.slice(2),rest),N))}
function start(u){run(pick(u),UNITS[u].t,u)}
function next(g){const i=UNITS.findIndex((u,k)=>u.g===g&&(lockLeft(k)||unitStat(k).m));
  if(i>=0)return start(i);run(uniq(shuf(every(g)),N),GROUPS[g]+' ミックス',null,g)}
function review(){const p=pending().sort((a,b)=>rec0(b.key).w-rec0(a.key).w||(rec0(a.key).t||0)-(rec0(b.key).t||0));
  if(p.length)run(shuf(uniq(p,N)),'ふくしゅう',null,null,true)}

function section(d){const t=totals(d.g),f=folded(d.g),nm=GROUPS[d.g];
  return `<h2 class="sh" data-f="${d.g}"><span class="chev">${f?'▶':'▼'}</span><span>${d.ic} ${nm}</span><small>${t.c} / ${t.n} もん クリア${t.c===t.n?' ⭐':''}${t.m?'　ふくしゅう '+t.m:''}</small>${d.guide?`<button class="link" data-h="${d.g}">📖 やりかた</button>`:''}</h2>`

function unitCard(u,k){const s=unitStat(k),full=s.c===s.n;
  return `<button class="unit ${isK(u.g)?'k':'m'}" data-u="${k}">${isK(u.g)?`<span class="em">${u.e}</span>`:`<span class="num ${u.e.length>1?'w':''}">${u.e}</span>`}<b>${esc(u.t)}</b><small>${s.c} / ${s.n} もん クリア</small>${s.m?`<span class="badge">ふくしゅう ${s.m}</span>`:full?'<span class="done">⭐</span>':''}<div class="meter"><i style="width:${Math.round(s.c/s.n*100)}%"></i></div></button>`}

  const tot=allStamps(),fl=Math.floor(tot/PET),pet=tot%PET;let got='';

  <div class="cnt"><span>きょう <i>${r}</i> かい</span><span>れんぞく <i>${streak()}</i> 日</span></div></div>
  ${lsOK||idbOK?'':`<p class="alert">${whereSaved()}。</p>`}

  ${SECS.map(section).join('')}

  <p class="note">1かい ${N}もん。おわると たまごが すこし そだつよ。${PET}かいで おとなに なって、いきものスタンプが 1こ できるよ。まとまりの もんだいを ぜんぶ クリアすると、ボスと たたかえるよ。${lv()===2?'ボスは じかんせいげん つき。3もん つづけて せいかいすると コンボで こうげきが 2ばいに なるよ。':''}</p>`;

/* ---- もんだいを出す（共通） ---- */
// #qa に選択肢（むずかしいの計算はテンキー）を出し、答えたら done(正解か, 時間切れか) を1回だけ呼ぶ
function ask(q,done){
  const el=document.getElementById('qa'),a=ans(q);let fin=false;
  const end=(ok,out)=>{document.getElementById('qs').innerHTML=body(q,true);spk(q,true);const hn=document.getElementById('hn');if(hn)hn.innerHTML='';
    const m=document.getElementById('ms');m.className='msg '+(ok?'ok':'ng');
    m.textContent=ok?'⭕ '+PRAISE[Math.floor(Math.random()*PRAISE.length)]:(out?'⏰ じかんぎれ！ ':'❌ ')+'こたえは「'+a+'」だよ';done(ok,!!out)};
  if(isNum(q)&&lv()===2){let v='';el.className='pad';
    el.innerHTML=[7,8,9,4,5,6,1,2,3].map(n=>`<button class="key" data-n="${n}">${n}</button>`).join('')+'<button class="key sub" data-n="x">けす</button><button class="key" data-n="0">0</button><button class="key go" data-n="ok">こたえる</button>';
    const ks=[...el.querySelectorAll('.key')],mk=()=>{const m=document.querySelector('#qs mark');if(m)m.textContent=v||(q.type==='s'?'□':'？')};
    const finish=out=>{if(fin)return;fin=true;ks.forEach(k=>k.disabled=true);end(!out&&v===a,out)};
    ks.forEach(k=>k.onclick=()=>{if(fin)return;const n=k.dataset.n;
      if(n==='ok'){if(v)finish(false);return}
      sfx('tap');if(n==='x')v=v.slice(0,-1);else if(v.length<3)v=(v==='0'?'':v)+n;mk()});
    return {timeout:()=>finish(true)}}
  const os=opts(q),cls=q.type==='w'?'kj':isNum(q)?'n':os.some(o=>o.length>5)?'long':'';
  el.className='opts'+(os.length===4?' four':'');
  el.innerHTML=os.map((o,i)=>`<button class="opt ${cls}" data-i="${i}">${esc(o)}</button>`).join('');
  const bs=[...el.querySelectorAll('.opt')];
  const finish=i=>{if(fin)return;fin=true;const ok=i>=0&&os[i]===a;
    bs.forEach((c,j)=>{c.disabled=true;if(os[j]===a)c.classList.add('ok')});if(i>=0&&!ok)bs[i].classList.add('ng');end(ok,i<0)};
  bs.forEach((b,i)=>b.onclick=()=>finish(i));return {timeout:()=>finish(-1)}}
function spk(q,done){const el=document.getElementById('sp'),t=voice(q,done);
  el.innerHTML=t&&ttsOn()?'<button id="sb">🔊 きく</button>':'';if(t&&ttsOn())document.getElementById('sb').onclick=()=>speak(t)}
// ヒント（□の けいさん と 11〜19のだん。ふつうの回だけ。ボスでは出さない）
function hintBtn(q){const el=document.getElementById('hn');if(!(q.type==='s'||(q.type==='m'&&q.a>10)))return;
  el.innerHTML='<button class="hbtn" id="hb">💡 ヒント</button>';
  document.getElementById('hb').onclick=()=>{sfx('tap');el.innerHTML=`<div class="how hint">${q.type==='s'?'<p>💡 '+esc(solve(q).hint)+'</p>':howM(q,true)}</div>`}}
function qcard(q,extra){return `<div class="card">${extra||''}<p class="ask">${label(q)}</p><div id="qs">${body(q,false)}</div><div class="spk" id="sp"></div><div id="hn"></div><div class="opts" id="qa"></div><p class="msg" id="ms"></p><div class="bar ctr"><button class="btn pri big" id="nx" hidden>つぎへ ▶</button></div></div>`}

function run(qs,title,u,g,isRev){
  if(!qs.length)return home();
  stopTick();screen='run';sfx('start');qs=qs.slice();const base=qs.length,log=[];let k=0,score=0,row=0;
  function show(){const q=qs[k];
    let dots='';for(let i=0;i<base;i++)dots+=`<i class="${log[i]==null?(i===k?'now':''):log[i]?'ok':'ng'}"></i>`;
    $.innerHTML=`<div class="top"><button class="back" id="bk">← やめる</button><span class="ttl">${esc(title)}</span><div class="dots">${dots}</div></div>`
      +qcard(q,q.re?'<p style="text-align:center;margin:0 0 6px"><span class="tag">もういちど ちょうせん</span></p>':'');
    document.getElementById('bk').onclick=home;spk(q,false);hintBtn(q);
    ask(q,ok=>{sfx(ok?'ok':'ng');mark(q,ok);if(!q.re){log[k]=ok;if(ok)score++;else qs.push(Object.assign({},q,{re:1}))}
      row=ok?row+1:0;if(row>=3)document.getElementById('ms').textContent+='　🔥 '+row+'もん れんぞく！';
      const nx=document.getElementById('nx');nx.hidden=false;nx.onclick=()=>{hush();k++;k<qs.length?show():result()}});
    window.scrollTo(0,0)}
  function result(){
    screen='res';stamp();const r=rounds(today()),tot=allStamps(),pet=tot%PET,full=pet===0;sfx(full?'adult':'grow');
    let stars='';for(let i=0;i<base;i++)stars+=i<score?'★':'<i>★</i>';
    const bossReady=u!=null&&!lockLeft(u)&&!beaten(u);
    $.innerHTML=`<div class="card res"><div class="stamp">${full?tile(PET,200,tot/PET-1):tile(pet,170,Math.floor(tot/PET))}</div><h1>${full?petOf(tot/PET-1).n+'に そだった！🎉':GROW[pet]}</h1>
    <p class="sc">${base}もん中 ${score}もん せいかい${score===base?'　ぜんぶ せいかい！':''}</p><div class="star">${stars}</div>
    <p class="sc">${full?'いきものスタンプが '+tot/PET+'こに なったよ！ つぎの たまごが とどいたよ。':'あと '+(PET-pet)+'かいで おとなに なるよ'}</p>
    ${bossReady?`<p class="alert">「${esc(UNITS[u].t)}」を ぜんぶ クリア！ ボスが あらわれた！</p>`:''}
    <div class="bar ctr">${bossReady?`<button class="btn rev big" id="bs">${MON[u%MON.length]} ボスと たたかう</button>`:''}
    <button class="btn pri big" id="ag">もう ${N}もん</button><button class="btn big" id="hm">おわる</button></div></div>`;
    document.getElementById('hm').onclick=home;
    if(bossReady)document.getElementById('bs').onclick=()=>boss(u);
    document.getElementById('ag').onclick=()=>{
      if(isRev&&pending().length)return review();
      if(g==='mix')return run(uniq(shuf(every('m')),N),'九九 ミックス',null,'mix');
      if(u!=null&&(lockLeft(u)||unitStat(u).m))return start(u);
      next(u!=null?UNITS[u].g:g||'k')};
    window.scrollTo(0,0)}
  show()}

/* ---- ボスバトル ---- */
let tick=null;function stopTick(){if(tick){clearInterval(tick);tick=null}}
function boss(u){
  stopTick();screen='boss';const U=UNITS[u],mon=MON[u%MON.length],hard=lv()===2,HP=hard?10:8,sec=hard?TIME[U.g][Math.min(2,beaten(u))]:0;
  let hp=HP,life=HEARTS,pool=[],combo=0;sfx('start');
  function draw(){if(!pool.length)pool=shuf(U.qs);return pool.pop()}
  function arena(cls,live){return `<div class="arena"><div class="bname">${esc(U.t)}の ボス${beaten(u)?'　Lv.'+(Math.min(2,beaten(u))+1):''}</div><div class="face ${cls||''}" id="fc">${mon}</div>
    <div class="hp"><i style="width:${hp/HP*100}%"></i></div><div class="hearts">${'❤️'.repeat(life)}${'🤍'.repeat(HEARTS-life)}</div>
    <div class="combo">${combo>=3?'🔥 '+combo+'コンボ！ こうげき 2ばい':combo===2?'あと 1もんで コンボ！':''}</div>${sec&&live?`<div class="tm"><i id="tb"></i></div>`:''}</div>`}
  function show(){const q=draw();
    $.innerHTML=`<div class="top"><button class="back" id="bk">← にげる</button><span class="ttl">ボスバトル</span><span></span></div><div id="ar">${arena('',true)}</div>`+qcard(q);
    document.getElementById('bk').onclick=home;spk(q,false);
    const h=ask(q,(ok,out)=>{stopTick();mark(q,ok);if(ok){combo++;hp=Math.max(0,hp-(combo>=3?2:1))}else{combo=0;life--}
      sfx(ok?(combo>=3?'combo':'hit'):out?'out':'ng');
      document.getElementById('ar').innerHTML=arena(ok?(hp?'hit':'down'):'');
      const nx=document.getElementById('nx');nx.hidden=false;
      nx.textContent=!hp?'やった！ ▶':ok?'こうげき！ ▶':'つぎへ ▶';
      nx.onclick=()=>{hush();(!hp||!life)?end(!hp):show()}});
    if(sec){const t0=Date.now();let last=0;tick=setInterval(()=>{const b=document.getElementById('tb');if(!b)return stopTick();
      const left=1-(Date.now()-t0)/(sec*1000);b.style.width=Math.max(0,left*100)+'%';b.className=left<.3?'red':'';
      const sl=Math.ceil(left*sec);if(sl>0&&sl<=3&&sl!==last){last=sl;sfx('time')}
      if(left<=0){stopTick();h.timeout()}},100)}
    window.scrollTo(0,0)}
  function end(win){
    stopTick();sfx(win?'win':'lose');if(win){st.boss[U.id]=beaten(u)+1;save()}
    $.innerHTML=`<div class="card res"><div class="stamp">${win?mon:'💦'}</div><h1>${win?'ボスを たおした！':'ざんねん…'}</h1>
    <p class="sc">${win?'「'+esc(U.t)+'」の ボスが ずかんに はいったよ。'+'★'.repeat(Math.min(3,beaten(u))):'もういちど れんしゅうして、また ちょうせんしよう。'}</p>
    ${win&&hard&&beaten(u)<3?'<p class="sc">つぎは ボスが レベルアップ！ じかんが みじかく なるよ。</p>':''}
    <div class="bar ctr"><button class="btn ${win?'':'pri'} big" id="ag">${win?'もういちど たたかう':'もういちど'}</button>${win?'':`<button class="btn big" id="pr">れんしゅうする</button>`}<button class="btn ${win?'pri':''} big" id="hm">おわる</button></div></div>`;
    document.getElementById('hm').onclick=home;document.getElementById('ag').onclick=()=>boss(u);
    if(!win)document.getElementById('pr').onclick=()=>start(u);window.scrollTo(0,0)}
  show()}

/* ---- おうちの方へ（きろく） ---- */
function records(){
  stopTick();screen='rec';hush();const t=totals(),g=st.days[today()]||[0,0,0];
  const days=[];for(let i=0;i<14;i++){const d=new Date();d.setDate(d.getDate()-i);const k=today(d),v=st.days[k];if(v)days.push([k,v])}
  const wrong=every().filter(q=>rec0(q.key).w>0).sort((a,b)=>rec0(b.key).w-rec0(a.key).w);
  let h=`<div class="top"><button class="back" id="bk">← もどる</button><span></span></div><div class="pa"><h1>おうちの方へ</h1>
  <div class="stats"><div><b>${g[0]}</b><small>今日といた数</small></div><div><b>${g[0]?Math.round(g[1]/g[0]*100)+'%':'–'}</b><small>今日の正答率</small></div>
  <div><b>${t.c} / ${t.n}</b><small>クリアした問題</small></div><div><b>${t.m}</b><small>復習待ちの問題</small></div></div>
  <p class="${lsOK||idbOK?'okline':'alert'}">${lsOK||idbOK?'記録はこの端末の中だけに保存されます（ログイン不要・外部送信なし）。':'この端末では記録を保存できません。'}</p>
  <h2>日ごとの記録（直近14日）</h2>${days.length?`<table><tr><th>日付</th><th class="r">回数</th><th class="r">といた数</th><th class="r">正解</th><th class="r">正答率</th></tr>
  ${days.map(([k,v])=>`<tr><td>${k}</td><td class="r">${v[2]||0}</td><td class="r">${v[0]}</td><td class="r">${v[1]}</td><td class="r">${v[0]?Math.round(v[1]/v[0]*100)+'%':'–'}</td></tr>`).join('')}</table>`:'<p>まだ記録がありません。</p>'}
  <h2>まとまりごとの進み具合</h2><table><tr><th>まとまり</th><th class="r">クリア</th><th class="r">正答率</th><th class="r">復習待ち</th><th class="r">ボス</th></tr>
  ${UNITS.map((u,k)=>{const s=unitStat(k);return `<tr><td>${GROUPS[u.g]}：${esc(u.t)}</td><td class="r">${s.c} / ${s.n}</td><td class="r">${s.rate==null?'–':s.rate+'%'}</td><td class="r ${s.m?'ngc':''}">${s.m||'–'}</td><td class="r">${beaten(k)?'★'.repeat(Math.min(3,beaten(k))):'–'}</td></tr>`}).join('')}</table>
  <p class="note" style="margin-top:6px">1回（${N}問）おわるごとに、たまごのいきものが1段階そだち、${PET}回でおとなになって「いきものスタンプ」1こになります（いま ${Math.floor(allStamps()/PET)}こ）。いきものは6種類×2色です。クリア＝1回以上正解した問題。正答率は、各問題のいちばん新しい答えで計算しています。まちがえた問題は「復習待ち」に入り、2回つづけて正解すると外れます。</p>
  <h2>まちがえたことのある問題（${wrong.length}問）</h2>${wrong.length?`<table><tr><th>問題</th><th class="r">まちがい</th><th class="r">正解</th><th class="r">いま</th></tr>
  ${wrong.map(q=>{const x=rec0(q.key);return `<tr><td>${esc(plain(q))}</td><td class="r ngc">${x.w}</td><td class="r">${x.r}</td><td class="r">${x.m?'復習待ち':'○'}</td></tr>`}).join('')}</table>`:'<p>まだありません。</p>'}
  <h2>設定</h2>
  <div class="bar"><button class="btn sm" id="lv">むずかしさ：${lv()===2?'むずかしい':'ふつう'}</button></div>
  <p class="note" style="margin:0 0 8px">むずかしい＝かんじは4択で、かき問題に形のにた字がまざります。計算は答えの数字を入力します。ボスは時間制限つきで、たおすたびに短くなります。ふつう＝すべて3択、時間制限なし。</p>
  <div class="bar"><button class="btn sm" id="sn">効果音：${sndOn()?'あり':'なし'}</button>${canSpeak?`<button class="btn sm" id="tt">読み上げボタン：${ttsOn()?'表示する':'表示しない'}</button>`:'<span class="note" style="margin:0">この端末では読み上げが使えません。</span>'}</div>
  <h2>記録のバックアップ</h2>
  <p>下の文字列をコピーして保存しておくと、あとで「読みこむ」で記録を戻せます。</p>
  <div class="bar"><button class="btn sm" id="ex">記録を書き出す</button><button class="btn sm" id="im">貼りつけた記録を読みこむ</button><button class="btn sm" id="rs">記録をすべて消す</button><button class="btn sm rev" id="rs2" hidden>本当に消す（元に戻せません）</button></div>
  <textarea id="tx" placeholder="ここに記録の文字列が出ます／貼りつけます"></textarea><p class="okline" id="bm"></p>
  <h2>このクイズについて</h2>
  <p>2年生のかんじは、小学2年生で習う160字を1字につき「よみ」「かき」の2問ずつ（320問）。じゅくごは、同じ2年生の字を使った音読み中心の熟語150語（300問）。3年生のかんじは、3年生で習う200字の先取り（400問）です。どれも意味の近いものでまとまりに分けてあり、教科書の順番とは一致しません。例文の、問われている語以外はひらがなで書いてあります。ホーム画面の各コーナーは、見出しを押すとたためます。九九は1〜9の段（81問）で、答えたあとに唱え方を表示します。唱え方は教科書によって一部ちがうことがあります。19×19は11〜19の段（各段 ×2〜×19、162問）で、「💡 ヒント」で分け方の図を、答えたあとに「10と残りに分ける」計算の手順を表示します。□の計算は、□に入る数をもとめる問題（5種類・${every('S').length}問）で、ヒントと、式を逆にたどる解き方の説明がつきます。</p></div>`;
  $.innerHTML=h;
  document.getElementById('bk').onclick=home;
  document.getElementById('lv').onclick=()=>{st.set.lv=lv()===2?1:2;save();records()};
  document.getElementById('sn').onclick=()=>{st.set.snd=!sndOn();save();sfx('ok');records()};
  if(canSpeak)document.getElementById('tt').onclick=()=>{st.set.tts=!ttsOn();save();records()};
  const tx=document.getElementById('tx'),bm=document.getElementById('bm');
  document.getElementById('ex').onclick=()=>{tx.value=JSON.stringify(st);tx.select();bm.textContent='書き出しました。全体をコピーして、メモなどに保存してください。'};
  document.getElementById('im').onclick=()=>{let s=null;try{s=JSON.parse(tx.value)}catch(e){}
    if(!valid(s)){bm.textContent='読みこめませんでした。書き出した文字列をそのまま貼りつけてください。';return}
    st=norm(s);save();records();document.getElementById('bm').textContent='読みこみました。'};
  document.getElementById('rs').onclick=()=>{document.getElementById('rs2').hidden=false};
  document.getElementById('rs2').onclick=()=>{st={v:1,q:{},days:{},boss:{},set:st.set,ts:0};save();records();document.getElementById('bm').textContent='記録を消しました。'};
  window.scrollTo(0,0)}

home();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
